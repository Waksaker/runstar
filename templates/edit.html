<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/sweetalert2.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='libs/jquery/dist/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='libs/bootstrap/dist/js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebarmenu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/datatables.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/datatables.css') }}" />

    <style>
        .table thead th {
            background-color: #495057 !important;
            color: white !important;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Sistem Starlika
        </span>

    </div>

</nav>


<div class="container mt-4">

    <h2>
        Edit Pengguna
    </h2>

    <a href="{{ url_for('index') }}" class="btn btn-secondary">Kembali</a>

    <div class="mt-4">

        <form method="POST" action="{{ url_for('edit_user', user_id=user.id ) }}">
            <div class="mb-3">
                <label for="username" class="form-label">Nama Pengguna</label>
                <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Kata Laluan</label>
                <input type="text" class="form-control" id="password" name="password" value="{{ user.password }}" required>
            </div>
            <div class="mb-3">
                <label for="trades" class="form-label">Trades</label>
                <input type="text" class="form-control" id="trades" name="trades" value="{{ user.trades }}" required>
            </div>
            <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-control" id="status" name="status" required>
                    <option value="0" {% if user.status == 0 %}selected{% endif %}>Trade Ended</option>
                    <option value="1" {% if user.status == 1 %}selected{% endif %}>Trade Running</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="transfer" class="form-label">Transfer</label>
                <select class="form-control" id="transfer" name="transfer" required>
                    <option value="0" {% if user.statranfer == 0 %}selected{% endif %}>No Transfer</option>
                    <option value="1" {% if user.statranfer == 1 %}selected{% endif %}>Transfer</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

    </div>

</div>

</body>

</html>
