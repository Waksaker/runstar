<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Laman Web Python + HTML</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/sweetalert2.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='libs/jquery/dist/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='libs/bootstrap/dist/js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebarmenu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.min.js') }}"></script>
    <script src="{{ url_for('static', filename='datatables/datatables.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='datatables/datatables.css') }}" />
    <style>
        :root {
            --bg-main: #0b1020;
            --bg-card: #141b30;
            --bg-accent: #1a2342;
            --text-primary: #ffffff;
            --text-secondary: #b0b8d4;
            --border-color: #2a3558;
            --grad-start: #00c6ff;
            --grad-end: #ff28d0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary);
        }

        .text-muted {
            color: var(--text-secondary) !important;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        .card-body h2 {
            color: var(--grad-start);
        }
        .btn-primary {
            background-color: #007bff; /* Biru asal Bootstrap */
            border-color: #007bff;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #0056b3; /* Biru lebih gelap bila di atas */
            border-color: #0056b3;
            color: #ffffff;
        }
        .btn-danger {
            background-color: #dc3545;
            border: none;
            border-radius: 8px;
        }

        .form-control {
            background-color: var(--bg-accent);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .form-control:focus {
            background-color: var(--bg-accent);
            color: var(--text-primary);
            border-color: var(--grad-start);
            box-shadow: 0 0 0 0.2rem rgba(0, 198, 255, 0.25);
        }
        @media (max-width: 576px) {
            .col-5 {
                flex: 0 0 46%;
                max-width: 46%;
            }
            .card-body {
                padding: 0.8rem;
            }
            .card-body h2 {
                font-size: 1.4rem;
            }
            .small-font {
                font-size: 1.1rem;
            }
        }
        /* ------ JADUAL ------ */
        .table-responsive {
            background-color: #141b30 !important;
            border-radius: 12px !important;
            border: 1px solid #2a3558 !important;
            padding: 1rem !important;
            box-shadow: none !important;
        }
        .table {
            color: #ffffff !important;
            background-color: transparent !important;
            margin-bottom: 0 !important;
        }
        /* Kepala jadual */
        .table thead.table-dark th {
            background-color: #1a2342 !important;
            color: #ffffff !important;
            border-color: #2a3558 !important;
        }
        /* Baris ganjil & genap */
        .table-striped tbody tr {
            background-color: #1e2744 !important;
        }
        .table-striped tbody tr:nth-of-type(even) {
            background-color: #252f52 !important;
        }
        /* Hover */
        .table-striped tbody tr:hover {
            background-color: #2c3863 !important;
        }
        /* Sel jadual */
        .table-bordered th,
        .table-bordered td {
            border-color: #354270 !important;
            vertical-align: middle !important;
            background-color: transparent !important;
        }

        /* ------ TEKS JADUAL PUTIH ------ */
        .table,
        .table th,
        .table td,
        .table tbody tr,
        .table tbody tr td {
            color: #ffffff !important;
        }
        /* Nama lajur kepala */
        .table thead th {
            color: #ffffff !important;
        }
        /* Pastikan teks dalam sel jelas */
        .table-striped tbody tr td {
            color: #ffffff !important;
        }
        /* Pilihan: ubah warna label kecil jadi kelabu cerah */
        .table td small,
        .table td span {
            color: #e0e7ff !important;
        }
        /* Baiki latar yang ditambah DataTables */
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter,
        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_paginate {
            color: #b0b8d4 !important;
        }
        .dataTables_wrapper select,
        .dataTables_wrapper input {
            background-color: #1a2342 !important;
            color: #fff !important;
            border-color: #2a3558 !important;
        }
        /* Badge status */
        .bg-success {
            background-color: #10b981 !important;
            color: #fff !important;
        }
        .bg-danger {
            background-color: #ef4444 !important;
            color: #fff !important;
        }
    </style>
</head>
<body>
	<div class="container mt-4">
		<div class="desktop-table mt-4">
			<form action="{{ url_for('submit') }}" method="post">

				<div class="d-flex justify-content-center gap-2">
					<input type="text"
						   class="form-control"
						   id="link"
						   name="link"
						   value="{{ link }}"
						   style="width: 500px;">

					<button type="submit" class="btn btn-primary">
						Submit
					</button>
				</div>

				<div class="text-center mt-2" style="width: 500px; margin-left: auto; margin-right: auto;">
					<label for="link" class="form-label text-muted">
						Contoh: https://starlika.cc
					</label>
				</div>

			</form>
		</div>
	</div>
	<div class="container mt-4">
		<div class="d-flex flex-wrap justify-content-center gap-3">
			<div class="col-5 col-sm-3">
				<div class="card shadow-sm border-0 h-100">
					<div class="card-body text-center">
						<h6 class="text-muted">Date</h6>
						<h2 class="fw-bold text-primary" id="date">-</h2>
					</div>
				</div>
			</div>

			<div class="col-5 col-sm-3">
				<div class="card shadow-sm border-0 h-100">
					<div class="card-body text-center">
						<h6 class="text-muted">Time</h6>
						<h2 class="fw-bold text-primary" id="time">-</h2>
					</div>
				</div>
			</div>

			<div class="col-5 col-sm-3">
				<div class="card shadow-sm border-0 h-100">
					<div class="card-body text-center">
						<h6 class="text-muted">Total Running</h6>
						<h2 class="fw-bold text-primary" id="totalrunning">0</h2>
					</div>
				</div>
			</div>

			<div class="col-5 col-sm-3">
				<div class="card shadow-sm border-0 h-100">
					<div class="card-body text-center" text-center>
						<h6 class="text-muted">Total Account</h6>
						<h2 class="fw-bold text-primary" id="totalaccount">0</h2>
					</div>
				</div>
			</div>


			<div class="col-5 col-sm-3">
				<div class="card shadow-sm border-0 h-100">
					<div class="card-body text-center">
						<h6 class="text-muted">Total Account Trade</h6>
						<h2 class="fw-bold text-primary" id="totaltrade">0</h2>
					</div>
				</div>
			</div>

			<div class="col-5 col-sm-3">
				<div class="card shadow-sm border-0 h-100">
					<div class="card-body text-center">
						<h6 class="text-muted">Total Account Transfer</h6>
						<h2 class="fw-bold text-primary" id="totaltransfer">0</h2>
					</div>
				</div>
			</div>
		</div>
	</div>
    <div class="container mt-4">
        <a href="{{ url_for('add_user')}}" class="btn btn-primary">Add Account</a>
	<!-- {% if statusupdate == 'update' %}
	    <a href="{{url_for('update')}}" class="btn btn-danger">Update</a>
	{% endif %} --!>
        <a href="{{url_for('update')}}" class="btn btn-danger">Update</a>
		<button onclick="autorun()" class="btn btn-primary">Autorun</button>
		<button onclick="alltrade()" class="btn btn-primary">Trade All</button>
		<button onclick="alltransfer()" class="btn btn-primary">Transfer All</button>
		<a href="{{url_for('percentage')}}" class="btn btn-primary">Percentage</a>
    </div>
    <div class="container mt-4">
        <div class="desktop-table mt-4">
	    <div class="table-responsive">
                <table id="mytable" class="table table-striped table-bordered table-hover w-100 text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>No</th>
                            <th>Username & Password</th>
                            <th>Trade</th>
                            <th>Time End</th>
			    <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        $(document).ready(function () {
	    $.fn.dataTable.ext.errMode = 'none';
            const table = $('#mytable').DataTable({
                ajax: {
                    url: '/app/user',
                    type: 'GET',
                    dataSrc: 'users'
                },
                columnDefs: [
                    { targets: '_all', className: 'text-center' }
                ],
                columns: [
                    {   // No — nombor urutan automatik
                        data: null,
                        orderable: false,
                        render: function (data, type, row, meta) {
                            return meta.row + 1;
                        }
                    },
                    { 
                        data: null,
                        render: function(data, type, row){
                            return "Username: " + data.username + '<br>' + "Password: " + data.password;
                        } 
                    },
                    { data: 'trades' },
                    { data: 'masa_akhir' },
		    {
		        data: null,
			render: function(data, type, row){
			    if (type !== 'display') return data;
			    // Isytihar pemboleh ubah dahulu
                            let starun, statrades, runstransfer;
			    //Untuk status running 
			    if (data.status === 1) {
			        starun = '<span class="badge bg-danger">RUNNING</span>'; 
			    } else if (data.status === 0) {
			        starun = '<span class="badge bg-success">FINISH</span>';
			    }
			    // Untuk status trade
			    if (data.statrade === 1) {
			        statrades = '<span class="badge bg-danger">TRADE</span>';
			    } else if (data.statrade === 0) {
			        statrades = '<span class="badge bg-success">NO TRADE</span>';
			    }
			    // Untuk status transfer
			    if (data.runtrans === 1) {
			        runstransfer = '<span class="badge bg-danger">TRANSFER</span>';
			    } else if (data.runtrans === 0) {
			        runstransfer = '<span class="badge bg-success">NO TRANSFER</span>';
			    }

			    return "Running: " + '<br>' + starun + '<br>' + 
			           "Trade: " + '<br>' + statrades + '<br>' + 
				   "Transfer: " + '<br>' + runstransfer;   
			}
		    },
                    {
                        data: null,
                        orderable: false,
                        render: function (data, type, row) {
							if (type !== 'display') return data;
							if (data.status == 1) {
								return '-';
							}
							if (data.status == 0) {
								return `
									<a class="btn btn-sm btn-primary" href="/edit/${row.id}">Edit</a>
									<a class="btn btn-sm btn-danger" href="/delete/${row.id}" onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
								`;
							}
                        }
                    }
                ],
                pageLength: 10,
                responsive: true,
                processing: true,
                language: {
                    search: 'Cari:',
                    lengthMenu: 'Papar _MENU_ rekod',
                    info: 'Papar _START_ hingga _END_ daripada _TOTAL_ rekod',
                    emptyTable: 'Tiada data tersedia',
                    zeroRecords: 'Tiada rekod dijumpai',
                    paginate: {
                        previous: 'Sebelumnya',
                        next: 'Seterusnya'
                    }
                }
            });

            // Kemas kini setiap 5 saat
            setInterval(function () {
                table.ajax.reload(null, false);
            }, 5000);
        });

        // Kemas kini statistik atas
        function updateMasa() {
            fetch('/app/masa')
                .then(response => {
                    if (!response.ok) throw new Error('Gagal');
                    return response.json();
                })
                .then(data => {
                    document.getElementById('totalaccount').textContent = data.jumlah_pengguna || 0;
                    document.getElementById('totalrunning').textContent = data.jumlah_running || 0;
		    document.getElementById('totaltrade').textContent = data.jumlah_trade || 0;
		    document.getElementById('totaltransfer').textContent = data.jumlah_transfer || 0;
                    document.getElementById('date').textContent = data.tarikh || '-';
                    document.getElementById('time').textContent = data.time || '-';
                })
                .catch(err => console.error('Ralat:', err));
        }
        updateMasa();
        setInterval(updateMasa, 1000);
    </script>
	<script>
		function updateMasa() {
			fetch('/app/masa')
				.then(response => {
					if (!response.ok) {
						throw new Error('Gagal mendapatkan data');
					}
					return response.json();
				})
				.then(data => {
					document.getElementById('totalaccount').textContent =
						data.jumlah_pengguna;
					document.getElementById('totalrunning').textContent =
						data.jumlah_running;
					document.getElementById('date').textContent =
						data.tarikh;
					document.getElementById('time').textContent =
						data.time;
				})
				.catch(error => {
					console.error('Error:', error);
				});
		}

		// Jalankan apabila page dibuka
		updateMasa();

		// Update setiap 1 saat
		setInterval(updateMasa, 1000);
	</script>
    <script>
        function alltransfer(){
            if(confirm("Do you want to transfer all accounts?")){
	        fetch('/app/runalltransfer/',{
                    method: 'GET'
		})
		.then(response => response.text())
		.then(data => {
                    console.log("Respons:", data);
		    //alert("Transfer all telah dijalankan")
		})
		.catch(error => {
                    alert("Ralat:" + error);
		});
	    }
	}
    </script>
    <script>
        function alltrade(){
            if(confirm("Do you want to trade all accounts?")){
	        fetch('/app/runalltrade/',{
                    method: 'GET'
		})
		.then(response => response.text())
		.then(data => {
                    console.log("Respons:", data);
		   //alert("Trade all telah dijalankan")
		})
		.catch(error => {
                    alert("Ralat:" + error);
		});
	    }
	}
    </script>
    <script>
        function autorun(){
            if(confirm("Do you want to auto run all accounts?")){
                fetch('/app/autorun/',{
                    method: 'GET'
                })
                .then(response => response.text())
                .then(data => {
                    console.log("Respons:", data);
                    //alert("Trade all telah dijalankan")
                })
                .catch(error => {
                    alert("Ralat:" + error);
                });
            }
        }
    </script>
</body>
</html>
