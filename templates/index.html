<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Laman Web Python + HTML</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/sweetalert2.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='libs/jquery/dist/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='libs/bootstrap/dist/js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebarmenu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.min.js') }}"></script>
    <script src="{{ url_for('static', filename='datatables/datatables.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='datatables/datatables.css') }}" />
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        h1 { color: #2c3e50; }
    </style>
</head>
<body>
	<div class="container mt-4">
		<div class="desktop-table mt-4">
			<form action="{{ url_for('submit') }}" method="post">

				<div class="d-flex justify-content-center gap-2">
					<input type="text"
						   class="form-control"
						   id="link"
						   name="link"
						   value="{{ link }}"
						   style="width: 500px;">

					<button type="submit" class="btn btn-primary">
						Submit
					</button>
				</div>

				<div class="text-center mt-2" style="width: 500px; margin-left: auto; margin-right: auto;">
					<label for="link" class="form-label text-muted">
						Contoh: https://starlika.cc
					</label>
				</div>

			</form>
		</div>
	</div>
	<div class="container mt-4">
		<div class="d-flex justify-content-center gap-2">
			<div class="col-md-3">
				<div class="card shadow-sm border-0">
					<div class="card-body">
						<h6 class="text-muted">Total Account</h6>
						<h2 class="fw-bold text-primary" id="totalaccount">0</h2>
					</div>
				</div>
			</div>
			
			<div class="col-md-3">
				<div class="card shadow-sm border-0">
					<div class="card-body">
						<h6 class="text-muted">Total Running</h6>
						<h2 class="fw-bold text-primary" id="totalrunning">0</h2>
					</div>
				</div>
			</div>

			<div class="col-md-3">
				<div class="card shadow-sm border-0">
					<div class="card-body">
						<h6 class="text-muted">Date</h6>
						<h2 class="fw-bold text-primary" id="date">-</h2>
					</div>
				</div>
			</div>

			<div class="col-md-3">
				<div class="card shadow-sm border-0">
					<div class="card-body">
						<h6 class="text-muted">Time</h6>
						<h2 class="fw-bold text-primary" id="time">-</h2>
					</div>
				</div>
			</div>
		</div>
	</div>
    <div class="container mt-4">
        <a href="{{ url_for('add_user')}}" class="btn btn-primary">Add Account</a>
	{% if statusupdate == 'update' %}
	    <a href="{{url_for('update')}}" class="btn btn-danger">Update</a>
	{% endif %}
		<button onclick="" class="btn btn-primary">Autorun</button>
		<button onclick="" class="btn btn-primary">Trade All</button>
		<button onclick="" class="btn btn-primary">Transfer All</button>
		<a href="" class="btn btn-primary">Percentage</a>
    </div>
	<div class="container mt-4">
        <div class="desktop-table mt-4">
            <div class="table-responsive shadow-sm p-3">
                <table id="mytable" class="table table-striped table-bordered table-hover w-100 text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>No</th>
                            <th>Username</th>
                            <th>Password</th>
                            <th>Trade</th>
                            <th>Time End</th>
                            <th>Status</th>
                            <th>Status Transfer</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        $(document).ready(function () {
            const table = $('#mytable').DataTable({
                ajax: {
                    url: '/app/user',
                    type: 'GET',
                    dataSrc: 'users'
                },
                columnDefs: [
                    { targets: '_all', className: 'text-center' }
                ],
                columns: [
                    {   // No — nombor urutan automatik
                        data: null,
                        orderable: false,
                        render: function (data, type, row, meta) {
                            return meta.row + 1;
                        }
                    },
                    { data: 'username' },
                    { data: 'password' },
                    { data: 'trades' },
                    { data: 'masa_akhir' },
                    {
                        data: 'status',
                        render: function (data, type, row) {
                            if (type !== 'display') return data;
                            if (data == 1) {
                                return '<span class="badge bg-danger">RUNNING</span>';
                            }
                            if (data == 0) {
                                return '<span class="badge bg-success">FINISH</span>';
                            }
                            return '<span class="badge bg-secondary">UNKNOWN</span>';
                        }
                    },
					{
						data: 'runtrans',
						render: function (data, type, row) {
							if (type !== 'display') return data;
							if (data == 1) {
								return '<span class="badge bg-danger">TRANSFER</span>';
							}
							if (data == 0) {
								return '<span class="badge bg-success">NO TRANSFER</span>';
							}
							return '<span class="badge bg-secondary">UNKNOWN</span>';
						}
					},
                    {
                        data: null,
                        orderable: false,
                        render: function (data, type, row) {
							if (type !== 'display') return data;
							if (data.status == 1) {
								return '-';
							}
							if (data.status == 0) {
								return `
									<a class="btn btn-sm btn-primary" href="/edit/${row.id}">Edit</a>
									<a class="btn btn-sm btn-danger" href="/delete/${row.id}" onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
								`;
							}
                        }
                    }
                ],
                pageLength: 10,
                responsive: true,
                processing: true,
                language: {
                    search: 'Cari:',
                    lengthMenu: 'Papar _MENU_ rekod',
                    info: 'Papar _START_ hingga _END_ daripada _TOTAL_ rekod',
                    emptyTable: 'Tiada data tersedia',
                    zeroRecords: 'Tiada rekod dijumpai',
                    paginate: {
                        previous: 'Sebelumnya',
                        next: 'Seterusnya'
                    }
                }
            });

            // Kemas kini setiap 5 saat
            setInterval(function () {
                table.ajax.reload(null, false);
            }, 5000);
        });

        // Kemas kini statistik atas
        function updateMasa() {
            fetch('/app/masa')
                .then(response => {
                    if (!response.ok) throw new Error('Gagal');
                    return response.json();
                })
                .then(data => {
                    document.getElementById('totalaccount').textContent = data.jumlah_pengguna || 0;
                    document.getElementById('totalrunning').textContent = data.jumlah_running || 0;
                    document.getElementById('date').textContent = data.tarikh || '-';
                    document.getElementById('time').textContent = data.time || '-';
                })
                .catch(err => console.error('Ralat:', err));
        }
        updateMasa();
        setInterval(updateMasa, 1000);
    </script>
	<script>
		function updateMasa() {
			fetch('/app/masa')
				.then(response => {
					if (!response.ok) {
						throw new Error('Gagal mendapatkan data');
					}
					return response.json();
				})
				.then(data => {
					document.getElementById('totalaccount').textContent =
						data.jumlah_pengguna;
					document.getElementById('totalrunning').textContent =
						data.jumlah_running;
					document.getElementById('date').textContent =
						data.tarikh;
					document.getElementById('time').textContent =
						data.time;
				})
				.catch(error => {
					console.error('Error:', error);
				});
		}

		// Jalankan apabila page dibuka
		updateMasa();

		// Update setiap 1 saat
		setInterval(updateMasa, 1000);
	</script>
</body>
</html>
