<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Starlika Controler</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/sweetalert2.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='libs/jquery/dist/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='libs/bootstrap/dist/js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebarmenu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.min.js') }}"></script>
    <script src="{{ url_for('static', filename='datatables/datatables.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='datatables/datatables.css') }}" />
    <style>
        :root {
            --bg-main: #0b1020;
            --bg-card: #141b30;
            --bg-accent: #1a2342;
            --text-primary: #ffffff;
            --text-secondary: #b0b8d4;
            --border-color: #2a3558;
            --grad-start: #00c6ff;
            --grad-end: #ff28d0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary);
        }

        .text-muted {
            color: var(--text-secondary) !important;
        }
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        .card-body h2 {
            color: var(--grad-start);
        }
        .btn-primary {
            background-color: #007bff; /* Biru asal Bootstrap */
            border-color: #007bff;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #0056b3; /* Biru lebih gelap bila di atas */
            border-color: #0056b3;
            color: #ffffff;
        }
        .btn-danger {
            background-color: #dc3545;
            border: none;
            border-radius: 8px;
        }

        .form-control {
            background-color: var(--bg-accent);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .form-control:focus {
            background-color: var(--bg-accent);
            color: var(--text-primary);
            border-color: var(--grad-start);
            box-shadow: 0 0 0 0.2rem rgba(0, 198, 255, 0.25);
        }
        @media (max-width: 576px) {
            .col-5 {
                flex: 0 0 46%;
                max-width: 46%;
            }
            .card-body {
                padding: 0.8rem;
            }
            .card-body h2 {
                font-size: 1.4rem;
            }
            .small-font {
                font-size: 1.1rem;
            }
        }
        /* ------ JADUAL ------ */
        .table-responsive {
            background-color: #141b30 !important;
            border-radius: 12px !important;
            border: 1px solid #2a3558 !important;
            padding: 1rem !important;
            box-shadow: none !important;
        }
        .table {
            color: #ffffff !important;
            background-color: transparent !important;
            margin-bottom: 0 !important;
        }
        /* Kepala jadual */
        .table thead.table-dark th {
            background-color: #1a2342 !important;
            color: #ffffff !important;
            border-color: #2a3558 !important;
        }
        /* Baris ganjil & genap */
        .table-striped tbody tr {
            background-color: #1e2744 !important;
        }
        .table-striped tbody tr:nth-of-type(even) {
            background-color: #252f52 !important;
        }
        /* Hover */
        .table-striped tbody tr:hover {
            background-color: #2c3863 !important;
        }
        /* Sel jadual */
        .table-bordered th,
        .table-bordered td {
            border-color: #354270 !important;
            vertical-align: middle !important;
            background-color: transparent !important;
        }

        /* ------ TEKS JADUAL PUTIH ------ */
        .table,
        .table th,
        .table td,
        .table tbody tr,
        .table tbody tr td {
            color: #ffffff !important;
        }
        /* Nama lajur kepala */
        .table thead th {
            color: #ffffff !important;
        }
        /* Pastikan teks dalam sel jelas */
        .table-striped tbody tr td {
            color: #ffffff !important;
        }
        /* Pilihan: ubah warna label kecil jadi kelabu cerah */
        .table td small,
        .table td span {
            color: #e0e7ff !important;
        }
        /* Baiki latar yang ditambah DataTables */
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter,
        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_paginate {
            color: #b0b8d4 !important;
        }
        .dataTables_wrapper select,
        .dataTables_wrapper input {
            background-color: #1a2342 !important;
            color: #fff !important;
            border-color: #2a3558 !important;
        }
        /* Badge status */
        .bg-success {
            background-color: #10b981 !important;
            color: #fff !important;
        }
        .bg-danger {
            background-color: #ef4444 !important;
            color: #fff !important;
        }
    </style>
</head>
<body>
	<div class="container mt-4">
        <h2>
            <u>Edit Link</u>
        </h2>
        <br>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Kembali</a>
        <div class="mt-4">
            <form action="{{ url_for('submit') }}" method="post">
                <label>Link(https://starlika.net)</label>	
                <div class="mb-3">
                    <input type="text" id="link" name="link" class="form-control" value="{{ link }}" style="max-width: 300px;" required>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
	</div>
</body>
