<script src="{{ url_for('static', filename='datatables/jquery-3.7.1.min.js') }}"></script>
<script src="{{ url_for('static', filename='datatables/datatables.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='datatables/datatables.css') }}" />
<div>
    <form action="{{ url_for('printprofit') }}" method="post" target="_blank" style="display: inline;">
        <input type="hidden" name="dateprofit" value="{{ tarikh }}">
        <button type="submit" class="btn btn-primary">
            <img src="{{ url_for('static', filename='images/print.png') }}" style="width: 24px; height: 24px; border: none;">
        </button>
    </form> 
</div>
<div class="container mt-4">
    <div class="desktop-table mt-4">
        <div class="table-responsive">
	    <div style="text-align: left;">
	        <h4>Total Profit: ${{ total_profit }}</h4>
	        <h4>Total Lock: ${{ total_lock }}</h4>
	    </div>
	    <table id="mytable" class="table table-striped table-bordered table-hover w-100 text-center">
	        <thead class="table-dark">
		    <tr>
		        <th style="text-align:center;">No</th>
			<th style="text-align:center;">Username & Password</th>
			<th style="text-align:center;">Profit & Lock</th>
                        <th style="text-align:center;">Datetime</th>
                    </tr>
                </thead>
		<tbody>
                    {% for rekod in data %}
		        <tr>
			    <td style="text-align:center;">{{rekod.no}}</td>
			    <td style="text-align:center">Username: {{rekod.username}}<br>Password: {{rekod.password}}</td>
                            <td style="text-align:center;">Profit: ${{rekod.profit}}<br>Lock: ${{rekod.lock}}</td>
                            <td style="text-align:center;">{{rekod.updated}}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
       </div>
    </div>
</div>
<script>
$(document).ready(function() {
    new DataTable('#mytable', {
        language: {
            search: "Cari:",
            lengthMenu: "_MENU_ rekod setiap halaman",
            info: "Memaparkan _START_ hingga _END_ daripada _TOTAL_ rekod",
            zeroRecords: "Tiada rekod dijumpai",
            paginate: {
                next: "Seterusnya",
                previous: "Sebelum"
            }
        }
    });
});
</script>
