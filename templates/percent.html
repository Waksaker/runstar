<html>
<head>
    <meta charset="UTF-8">
    <title>Laman Web Python + HTML</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/sweetalert2.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='libs/jquery/dist/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='libs/bootstrap/dist/js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebarmenu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.min.js') }}"></script>
    <script src="{{ url_for('static', filename='datatables/datatables.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='datatables/datatables.css') }}" />
    <style>
        :root {
            --bg-main: #0b1020;
            --bg-card: #141b30;
            --bg-accent: #1a2342;
            --text-primary: #ffffff;
            --text-secondary: #b0b8d4;
            --border-color: #2a3558;
            --blue-btn: #007bff;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .container {
            color: var(--text-primary);
        }

        /* Butang utama */
        .btn-primary {
            background-color: var(--blue-btn);
            border-color: var(--blue-btn);
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
            color: #ffffff;
        }
        /* Jadual */
        .table-responsive {
            background-color: var(--bg-card) !important;
            border-radius: 12px !important;
            border: 1px solid var(--border-color) !important;
            padding: 1rem !important;
            box-shadow: none !important;
        }
        .table {
            color: var(--text-primary) !important;
            background-color: transparent !important;
        }
        .table thead.table-dark {
            background-color: var(--bg-accent) !important;
            color: #ffffff !important;
        }
        .table-dark th {
            border-color: var(--border-color) !important;
            background-color: var(--bg-accent) !important;
        }
        /* Baris ganjil & genap - paksa terus pada tr */
        .table-striped tbody tr {
            background-color: #1e2744 !important;
        }
        .table-striped tbody tr:nth-of-type(even) {
            background-color: #252f52 !important;
        }
        /* Pastikan sel ikut warna latar ibu */
        .table-striped tbody tr td {
            background-color: transparent !important;
            color: #ffffff !important;
        }
        /* Hover */
        .table-striped tbody tr:hover {
            background-color: #2c3863 !important;
        }
        /* Sel & sempadan */
        .table-bordered th,
        .table-bordered td {
            border-color: #354270 !important;
            color: #ffffff !important;
            vertical-align: middle;
        }
        /* Butang Delete */
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }
        /* Kotak carian & paging DataTables */
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter,
        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_paginate {
            color: var(--text-secondary) !important;
        }
        .dataTables_wrapper select,
        .dataTables_wrapper input {
            background-color: var(--bg-accent) !important;
            color: #fff !important;
            border: 1px solid var(--border-color) !important;
        }
        .dataTables_wrapper .paginate_button {
            background-color: var(--bg-accent) !important;
            border: 1px solid var(--border-color) !important;
            color: #fff !important;
        }
        .dataTables_wrapper .paginate_button.current {
            background-color: var(--blue-btn) !important;
            border-color: var(--blue-btn) !important;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <a href="{{url_for('index')}}" class="btn btn-primary">List Account</a>
    </div>
    <div class="container mt-4">
        <div class="desktop-table mt-4">
            <div class="table-responsive">
                <table id="mytable" class="table table-striped table-bordered table-hover w-100 text-center">
                    <thead class="table-dark">
                        <tr>
                            <th style="text-align:center;">No</th>
                            <th style="text-align:center;">Percentage</th>
                            <th style="text-align:center;">Date</th>
                            <th style="text-align:center:">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                    {% for rekod in data %}
                        <tr>
                            <td style="text-align:center;">{{rekod.no}}</td>
                            <td style="text-align:center;">{{rekod.percent}}</td>
                            <td style="text-align:center;">{{rekod.date}}</td>
                            <td style="text-align:center;">
                                <a class="btn btn-sm btn-danger" href="/deletepct/{{rekod.id}}" onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
                            </td>
                        </tr>
                    {% else %}
                        <tr>
		            <td colspan="2">Tiada rekod dijumpai</td>
                	</tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        new DataTable('#mytable')
    </script>
</body>
</html>
